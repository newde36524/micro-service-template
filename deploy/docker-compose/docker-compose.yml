## 本地开发环境
services:
  #zookeeper是kafka的依赖 - Zookeeper is the dependencies of Kafka
  zookeeper:
    image: wurstmeister/zookeeper
    container_name: zookeeper
    environment:
      # 时区上海 - Time zone Shanghai (Change if needed)
      TZ: Asia/Shanghai
    restart: always
    ports:
      - "2181:2181"

  #消息队列 - Message queue
  kafka:
    image: wurstmeister/kafka:2.13-2.8.1
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CREATE_TOPICS="kuaima-log:1:1"
      - KAFKA_ADVERTISED_HOST_NAME=kafka
      # 未设置 KAFKA_ADVERTISED_PORT 时脚本会生成空的 advertised.port 导致启动失败
      # When KAFKA_ADVERTISED_PORT is not set, the script generates empty advertised.port causing startup failure
      - KAFKA_ADVERTISED_PORT=9092
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=false
      - TZ=Asia/Shanghai
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - zookeeper

  mysql:
    image: mysql/mysql-server:8.0.13
    container_name: mysql
    environment:
      TZ: Asia/Shanghai
      # root 密码 - root password
      MYSQL_ROOT_PASSWORD: abc123456
    ports:
      - "13306:3306"
    volumes:
      # 数据挂载 - Data mounting
      - ./data/mysql/data:/var/lib/mysql
      # 日志
    command:
      # 将mysql8.0默认密码策略 修改为 原先 策略 (mysql8.0对其默认策略做了更改 会导致密码无法匹配)
      # Modify the Mysql 8.0 default password strategy to the original strategy (MySQL8.0 to change its default strategy will cause the password to be unable to match)
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci
      --explicit_defaults_for_timestamp=true
      --lower_case_table_names=1
    privileged: true
    restart: always

  #redis容器 - Redis container
  redis:
    image: redis:7.2.1
    container_name: redis
    ports:
      - "6379:6379"
    environment:
      # 时区上海 - Time zone Shanghai (Change if needed)
      TZ: Asia/Shanghai
    volumes:
      # 数据文件 - data files
      - ./data/redis/data:/data:rw
    command: "redis-server --requirepass 123456 --appendonly yes"
    privileged: true
    restart: always
  
  #asynqmon asynq延迟队列、定时队列的webui - Asynqmon asynq delay queue, timing queue's webUI
  asynqmon:
    image: hibiken/asynqmon:latest
    # hibiken/asynqmon 仅提供 amd64 镜像，Apple Silicon 需通过仿真运行
    # hibiken/asynqmon only provides amd64 image, need emulation on Apple Silicon
    platform: linux/amd64
    container_name: asynqmon
    ports:
      - "8980:8080"
    command:
      - '--redis-addr=redis:6379'
      - '--redis-password=123456'
    restart: always
    depends_on:
      - redis


